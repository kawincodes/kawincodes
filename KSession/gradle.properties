org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Pinned Cloudflare Tunnel engine (cloudflared) bundled into the APK at build time.
# Set ksession.bundleEngine=false to build without the engine (it can then be installed in-app
# with the sideload flavor).
ksession.bundleEngine=true
ksession.engineVersion=2026.10.3
