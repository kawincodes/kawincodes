name: Hermes Deck Android

on:
  push:
    branches: ['**']
    # Pushing a hermes-deck-v* tag also publishes the APK as a GitHub release.
    tags: ['hermes-deck-v*']
    paths:
      - 'hermes-deck/**'
      - '.github/workflows/hermes-deck.yml'
  pull_request:
    paths:
      - 'hermes-deck/**'
      - '.github/workflows/hermes-deck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes-deck
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermes-deck/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install OpenSSH server and shellcheck (for integration tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server shellcheck

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: JVM tests and debug APK
        working-directory: hermes-deck/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: hermes-deck-debug-apk
          path: hermes-deck/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/hermes-deck-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: hermes-deck-debug-apk

      - name: Publish release with a stable download name
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv app-debug.apk hermes-deck.apk
          gh release create "$TAG" hermes-deck.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hermes Deck ${TAG#hermes-deck-v}" \
            --latest \
            --notes "Android app that deploys and chats with Nous Research's Hermes Agent. Debug-signed build: allow installing unknown apps on your phone. See hermes-deck/README.md."
