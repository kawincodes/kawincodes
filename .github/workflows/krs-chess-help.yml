name: KRS Chess Help (Android)

on:
  push:
    paths:
      - "krs-chess-help/**"
      - ".github/workflows/krs-chess-help.yml"
  pull_request:
    paths:
      - "krs-chess-help/**"
      - ".github/workflows/krs-chess-help.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: krs-chess-help
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and debug APK
        run: ./gradlew test :app:lintDebug :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: krs-chess-help-debug-apk
          path: krs-chess-help/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
