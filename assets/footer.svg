<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-labelledby="title desc">
<title id="title">End of transmission — thanks for stopping by</title>
<desc id="desc">Animated footer with a synthwave grid, signal waveform and closing messages.</desc>
<style>
text{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}

.rm{display:none}
@media (prefers-reduced-motion: reduce){.am{display:none}.rm{display:inline}}

@media (prefers-reduced-motion: no-preference){
 .hl{animation:hl 2.6s cubic-bezier(.55,.05,.9,.45) infinite}
 .blink{animation:blink 1.1s steps(1) infinite}
 .eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq var(--d,1s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
 .flow{animation:flow 3s linear infinite}
 .tw{animation:tw var(--d,3s) ease-in-out infinite;animation-delay:var(--dl,0s)}
}
@keyframes hl{0%{transform:translateY(0);opacity:0}12%{opacity:.8}100%{transform:translateY(100px);opacity:.95}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes eq{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
@keyframes flow{to{stroke-dashoffset:-48}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
</style>
