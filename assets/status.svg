rray="2 4"/><text x="876" y="282" font-size="12" font-weight="700" fill="#3DFF8A">BASE</text><text x="968" y="282" font-size="13" fill="#E8FFF3" textLength="179.4" lengthAdjust="spacing">India · IST (UTC+05:30)</text><line x1="876" y1="298" x2="1236" y2="298" stroke="#16402A" stroke-dasharray="2 4"/><text x="876" y="320" font-size="12" font-weight="700" fill="#3DFF8A">MODES</text><text x="968" y="320" font-size="13" fill="#E8FFF3" textLength="187.2" lengthAdjust="spacing">13 collaboration options</text><line x1="876" y1="336" x2="1236" y2="336" stroke="#16402A" stroke-dasharray="2 4"/><text x="876" y="358" font-size="12" font-weight="700" fill="#3DFF8A">NODES</text><text x="968" y="358" font-size="13" fill="#E8FFF3" textLength="202.8" lengthAdjust="spacing">@kawincodes · @kawinthedev</text></g><rect x=".75" y=".75" width="1278.5" height="416.5" rx="19.5" fill="none" stroke="#00FF9C" stroke-opacity=".3" stroke-width="1.5"/>
