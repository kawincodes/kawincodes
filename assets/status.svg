<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="418" viewBox="0 0 1280 418" role="img" aria-labelledby="title desc">
<title id="title">System status — active missions, research queue and uplink</title>
<desc id="desc">Dashboard with current focus areas, what is being learned right now, and contact details.</desc>
<style>
text{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.disp,.disp text{font-family:'Orbitron','Rajdhani','Bahnschrift','DIN Alternate','Eurostile','Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:700}
@media (prefers-reduced-motion: no-preference){
 .shimmer{animation:shimmer var(--d,2.4s) ease-in-out infinite;animation-delay:var(--dl,0s)}
 .spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 1.4s linear infinite}
 .blink{animation:blink 1.1s steps(1) infinite}
 .pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 2.2s ease-out infinite}
 .dots{animation:dots 1.6s steps(1) infinite}
}
@keyframes shimmer{0%{transform:translateX(0)}100%{transform:translateX(330px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%{transform:scale(.7);opacity:.85}100%{transform:scale(1.9);opacity:0}}
@keyframes dots{0%{opacity:.25}33%{opacity:.6}66%{opacity:1}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020604"/><stop offset="1" stop-color="#06140C"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1C12"/><stop offset="1" stop-color="#06110B"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#1D4A33" fill-opacity=".5"/></pattern>
<filter id="glowSm" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="frame"><rect width="1280" height="418" rx="20"/></clipPath>
</defs>
<g clip-path="url(#frame)"><rect width="1280" height="418" fill="url(#bg)"/><rect width="1280" height="418" fill="url(#dots)"/><text x="34" y="44" font-size="15" xml:space="preserve"><tspan fill="#00FF9C" font-weight="700">◢ SYSTEM STATUS</tspan><tspan fill="#7FA592">  //  CURRENT DIRECTION · RESEARCH QUEUE · UPLINK</tspan></text><circle class="blink" cx="1160" cy="39" r="5" fill="#3DFF8A" filter="url(#glowSm)"/><text x="1174" y="44" font-size="14" font-weight="700" fill="#3DFF8A">LIVE FEED</text><line x1="34" y1="60" x2="1246" y2="60" stroke="#16402A"/><rect x="24" y="76" width="400" height="320" rx="14" fill="url(#panel)" stroke="#00FF9C" stroke-opacity=".35"/><path d="M38 76h60" stroke="#00FF9C" stroke-width="3" stroke-linecap="round" filter="url(#glowSm)"/><text x="44" y="110" font-size="14" xml:space="preserve"><tspan fill="#00FF9C" font-weight="700">[A1]</tspan><tspan fill="#E8FFF3" font-weight="700"> ACTIVE MISSIONS</tspan></text><text x="44" y="142" font-size="14" font-weight="700" fill="#E8FFF3">AI-NATIVE PRODUCTS</text><text x="404" y="142" font-size="11" font-weight="700" text-anchor="end" fill="#3DFF8A">● LIVE</text><text x="44" y="160" font-size="12" fill="#7FA592">useful AI on reliable architecture</text><svg x="44" y="168" width="360" height="3"><rect width="360" height="3" rx="1.5" fill="#00FF9C" fill-opacity=".3"/><rect class="shimmer" style="--d:2.20s;--dl:-0.0s" x="-30" width="60" height="3" fill="url(#shine)"/></svg><text x="44" y="196" font-size="14" font-weight="700" fill="#E8FFF3">SAAS FOUNDATIONS</text><text x="404" y="196" font-size="11" font-weight="700" text-anchor="end" fill="#3DFF8A">● LIVE</text><text x="44" y="214" font-size="12" fill="#7FA592">secure multi-tenant boundaries</text><svg x="44" y="222" width="360" height="3"><rect width="360" height="3" rx="1.5" fill="#00FF9C" fill-opacity=".3"/><rect class="shimmer" style="--d:2.55s;--dl:-0.5s" x="-30" width="60" height="3" fill="url(#shine)"/></svg><text x="44" y="250" font-size="14" font-weight="700" fill="#E8FFF3">PLATFORM AUTOMATION</text><text x="404" y="250" font-size="11" font-weight="700" text-anchor="end" fill="#3DFF8A">● LIVE</text><text x="44" y="268" font-size="12" fill="#7FA592">repeatable builds, tests &amp; deploys</text><svg x="44" y="276" width="360" height="3"><rect width="360" height="3" rx="1.5" fill="#00FF9C" fill-opacity=".3"/><rect class="shimmer" style="--d:2.90s;--dl:-1.0s" x="-30" width="60" height="3" fill="url(#shine)"/></svg><text x="44" y="304" font-size="14" font-weight="700" fill="#E8FFF3">CLOUD-NATIVE ENGINEERING</text><text x="404" y="304" font-size="11" font-weight="700" text-anchor="end" fill="#3DFF8A">● LIVE</text><text x="44" y="322" font-size="12" fill="#7FA592">resilient, observable services</text><svg x="44" y="330" width="360" height="3"><rect width="360" height="3" rx="1.5" fill="#00FF9C" fill-opacity=".3"/><rect class="shimmer" style="--d:3.25s;--dl:-1.5s" x="-30" width="60" height="3" fill="url(#shine)"/></svg><text x="44" y="358" font-size="14" font-weight="700" fill="#E8FFF3">OPEN-SOURCE LEARNING</text><text x="404" y="358" font-size="11" font-weight="700" text-anchor="end" fill="#3DFF8A">● LIVE</text><text x="44" y="376" font-size="12" fill="#7FA592">contributions &amp; shared knowledge</text><svg x="44" y="384" width="360" height="3"><rect width="360" height="3" rx="1.5" fill="#00FF9C" fill-opacity=".3"/><rect class="shimmer" style="--d:3.60s;--dl:-2.0s" x="-30" width="60" height="3" fill="url(#shine)"/></svg><rect x="440" y="76" width="400" height="320" rx="14" fill="url(#panel)" stroke="#FFB000" stroke-opacity=".35"/><path d="M454 76h60" stroke="#FFB000" stroke-width="3" stroke-linecap="round" filter="url(#glowSm)"/><text x="460" y="110" font-size="14" xml:space="preserve"><tspan fill="#FFB000" font-weight="700">[B2]</tspan><tspan fill="#E8FFF3" font-weight="700"> RESEARCH QUEUE</tspan></text><g transform="translate(468 137)"><circle r="8" stroke="#16402A" stroke-width="2.5" fill="none"/><path cla