<title id="title">09 // COMMS</title>
<desc id="desc">Section header — uplink.cfg · open a channel</desc>
<style>
text{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.disp,.disp text{font-family:'Orbitron','Rajdhani','Bahnschrift','DIN Alternate','Eurostile','Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:700}
@media (prefers-reduced-motion: no-preference){
 .spin{transform-box:view-box;transform-origin:54px 52px;animation:spin 18s linear infinite}
 .blink{animation:blink 1.1s steps(1) infinite}
 .ride{animation:ride 3.4s ease-in-out infinite alternate}
 .cur{animation:cur 1.6s ease-in-out infinite}
 .sweep{animation:sweep 6s linear infinite}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes ride{from{transform:translateX(0)}to{transform:translateX(524.3px)}}
@keyframes cur{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(1240px)}}
</style>
