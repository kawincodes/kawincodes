<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="96" viewBox="0 0 1000 96" role="img" aria-labelledby="title desc">
<title id="title">06 // TELEMETRY</title>
<desc id="desc">Section header — metrics.stream · live GitHub analytics</desc>
<style>
text{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.disp,.disp text{font-family:'Orbitron','Rajdhani','Bahnschrift','DIN Alternate','Eurostile','Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:700}
@media (prefers-reduced-motion: no-preference){
 .spin{transform-box:view-box;transform-origin:42px 46px;animation:spin 18s linear infinite}
 .blink{animation:blink 1.1s steps(1) infinite}
 .ride{animation:ride 3.4s ease-in-out infinite alternate}
 .cur{animation:cur 1.6s ease-in-out infinite}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes ride{from{transform:translateX(0)}to{transform:translateX(466px)}}
@keyframes cur{0%,100%{opacity:1}50%{opacity:.35}}
</style>
